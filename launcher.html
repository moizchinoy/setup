    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --card-hover: #2a2a2a;
            --dropdown-bg: #1e1e1e;
            --dropdown-text: #ffffff;
            --dropdown-border: #333333;
            --separator-color: #333333;
            --muted-text: #888888;
            --input-bg: #1e1e1e;
            --input-border: #444444;
            --focus-outline: #0071e3;
            --toggle-bg: #444444;
            --match-color: #4da6ff;
            --star-color: #ffca28;
            --modal-backdrop: rgba(0, 0, 0, 0.7);
            --modal-bg: #181818;
            --badge-green: #28a745;
            --badge-red: #dc3545;
        }

        :root.light-theme {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --card-bg: #ffffff;
            --card-hover: #e8e8ed;
            --dropdown-bg: #ffffff;
            --dropdown-text: #1d1d1f;
            --dropdown-border: #cccccc;
            --separator-color: #e2e2e7;
            --muted-text: #6e6e73;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --focus-outline: #0071e3;
            --toggle-bg: #cccccc;
            --match-color: #005bb5;
            --star-color: #f59e0b;
            --modal-backdrop: rgba(0, 0, 0, 0.4);
            --modal-bg: #ffffff;
            --badge-green: #198754;
            --badge-red: #d9534f;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 35px;
            max-width: 1200px;
        }

        .clocks-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .local-row {
            font-size: 22px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .utc-row {
            font-size: 18px;
            color: var(--muted-text);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-wrapper {
            position: relative;
        }

        .local-search-input {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 10px;
            outline: none;
            width: 460px;
            box-sizing: border-box;
            transition: width 0.25s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .local-search-input:focus {
            border-color: var(--focus-outline);
            width: 580px;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.25);
        }

        .launcher-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            background-color: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: 10px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            max-height: 420px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .launcher-dropdown.active {
            display: block;
        }

        .dropdown-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            color: var(--text-color);
            text-decoration: none;
            cursor: pointer;
            border-bottom: 1px solid var(--separator-color);
            font-size: 17px;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item.selected, .dropdown-item:hover {
            background-color: var(--card-hover);
        }

        .dropdown-item .item-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item .category-tag {
            font-size: 13px;
            color: var(--muted-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dropdown-item .tool-tag {
            font-size: 12px;
            background-color: var(--focus-outline);
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .dropdown-item .star-badge {
            color: var(--star-color);
            font-size: 15px;
        }

        .settings-wrapper {
            position: relative;
        }

        .icon-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            width: 50px;
            height: 50px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
        }

        .icon-btn:hover, .icon-btn:focus {
            background-color: var(--card-hover);
            border-color: var(--focus-outline);
        }

        .settings-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background-color: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            padding: 12px;
            width: 200px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 1001;
        }

        .settings-menu.active {
            display: flex;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-color);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-bg);
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--focus-outline);
        }

        input:checked+.slider:before {
            transform: translateX(16px);
        }

        .theme-selector {
            background-color: var(--input-bg);
            color: var(--dropdown-text);
            border: 1px solid var(--dropdown-border);
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        .section-title {
            max-width: 1200px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted-text);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--separator-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            max-width: 1200px;
        }

        .bookmark-card {
            background-color: var(--card-bg);
            padding: 22px 16px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            outline: none;
            position: relative;
        }

        .bookmark-card:focus, .bookmark-card:hover {
            background-color: var(--card-hover);
        }

        .bookmark-card:focus {
            box-shadow: 0 0 0 2px var(--focus-outline);
        }

        .bookmark-card .card-star {
            position: absolute;
            top: 8px;
            right: 10px;
            color: var(--star-color);
            font-size: 12px;
        }

        .bookmark-card span.card-name {
            font-size: 15px;
            font-weight: bold;
        }

        mark {
            background-color: transparent;
            color: var(--match-color);
            font-weight: 800;
            padding: 0;
        }

        /* Modal Overlay & Styling */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--modal-backdrop);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-container {
            background-color: var(--modal-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: 12px;
            width: 100%;
            max-width: 820px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: 90vh;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid var(--separator-color);
            background-color: var(--card-bg);
        }

        .modal-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--muted-text);
            font-size: 15px;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .tab-btn:hover {
            color: var(--text-color);
            background-color: var(--card-hover);
        }

        .tab-btn.active {
            color: var(--text-color);
            background-color: var(--input-border);
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: var(--muted-text);
            font-size: 24px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .modal-close-btn:hover {
            color: var(--text-color);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tool-pane {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .tool-pane.active {
            display: flex;
        }

        .tool-textarea {
            width: 100%;
            height: 140px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        .tool-textarea:focus {
            border-color: var(--focus-outline);
        }

        .tool-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Uniform neutral button styling for all action buttons */
        .action-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .action-btn:hover {
            background-color: var(--card-hover);
            border-color: var(--focus-outline);
        }

        .action-btn:focus {
            box-shadow: 0 0 0 2px var(--focus-outline);
        }

        .tool-output-label {
            font-size: 13px;
            font-weight: bold;
            color: var(--muted-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        .status-msg {
            font-size: 13px;
            font-weight: bold;
        }

        .status-msg.error { color: var(--badge-red); }
        .status-msg.success { color: var(--badge-green); }

        .jwt-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .jwt-card {
            background-color: var(--card-bg);
            border: 1px solid var(--separator-color);
            border-radius: 6px;
            padding: 10px 14px;
        }

        .jwt-card-title {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--muted-text);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .jwt-code {
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }

        .badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
        }

        .badge.valid { background-color: var(--badge-green); }
        .badge.expired { background-color: var(--badge-red); }
    </style>
</head>

<body>

    <div class="header">
        <div class="clocks-stack">
            <div class="local-row"><span id="local-clock">00:00:00</span> — <span id="local-date">Loading...</span></div>
            <div class="utc-row">UTC: <span id="utc-clock">00:00:00</span> — <span id="utc-date">Loading...</span></div>
        </div>

        <div class="controls-group">
            <div class="search-wrapper">
                <input type="text" id="localSearch" class="local-search-input" placeholder="Type / to search bookmarks or tools..." autocomplete="off">
                <div id="launcherDropdown" class="launcher-dropdown"></div>
            </div>

            <button id="toolsBtn" class="icon-btn" title="Developer Tools" aria-label="Developer Tools">🧰</button>

            <div class="settings-wrapper">
                <button id="gearBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
                <div id="settingsMenu" class="settings-menu">
                    <div class="settings-row">
                        <span>New Tab</span>
                        <label class="toggle-container">
                            <span class="switch">
                                <input type="checkbox" id="tabToggle">
                                <span class="slider"></span>
                            </span>
                        </label>
                    </div>
                    <div class="settings-row">
                        <span>Theme</span>
                        <select id="themeSelect" class="theme-selector">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="section-title">
        <span>★ Pinned Favorites</span>
    </div>

    <div id="starred-grid" class="grid-container"></div>

    <!-- Dev Tools Modal -->
    <div id="toolsModal" class="modal-backdrop">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-tabs">
                    <button class="tab-btn active" data-tab="base64">Base64</button>
                    <button class="tab-btn" data-tab="json">JSON Beautifier</button>
                    <button class="tab-btn" data-tab="jwt">JWT Decoder</button>
                </div>
                <button id="closeModalBtn" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                
                <!-- Base64 Pane -->
                <div id="pane-base64" class="tool-pane active">
                    <textarea id="b64Input" class="tool-textarea" placeholder="Paste or type text here..."></textarea>
                    <div class="tool-actions">
                        <button id="b64EncodeBtn" class="action-btn">Encode Base64</button>
                        <button id="b64DecodeBtn" class="action-btn">Decode Base64</button>
                        <button id="b64CopyBtn" class="action-btn">Copy Output</button>
                        <span id="b64Status" class="status-msg"></span>
                    </div>
                    <div class="tool-output-label">Output</div>
                    <textarea id="b64Output" class="tool-textarea" readonly placeholder="Result will appear here..."></textarea>
                </div>

                <!-- JSON Pane -->
                <div id="pane-json" class="tool-pane">
                    <textarea id="jsonInput" class="tool-textarea" placeholder="Paste unformatted or stringified JSON here..."></textarea>
                    <div class="tool-actions">
                        <button id="jsonFormat2Btn" class="action-btn">Beautify (2 Spaces)</button>
                        <button id="jsonFormat4Btn" class="action-btn">Beautify (4 Spaces)</button>
                        <button id="jsonMinifyBtn" class="action-btn">Minify</button>
                        <button id="jsonCopyBtn" class="action-btn">Copy Output</button>
                        <span id="jsonStatus" class="status-msg"></span>
                    </div>
                    <div class="tool-output-label">Output</div>
                    <textarea id="jsonOutput" class="tool-textarea" readonly placeholder="Formatted JSON will appear here..."></textarea>
                </div>

                <!-- JWT Pane -->
                <div id="pane-jwt" class="tool-pane">
                    <textarea id="jwtInput" class="tool-textarea" style="height: 90px;" placeholder="Paste JWT token here (e.g. eyJhbGciOi...)"></textarea>
                    <div class="tool-actions">
                        <button id="jwtDecodeBtn" class="action-btn">Decode Token</button>
                        <span id="jwtStatus" class="status-msg"></span>
                    </div>
                    <div class="jwt-grid">
                        <div class="jwt-card">
                            <div class="jwt-card-title">Header</div>
                            <pre id="jwtHeader" class="jwt-code">{}</pre>
                        </div>
                        <div class="jwt-card">
                            <div class="jwt-card-title">
                                <span>Payload</span>
                                <span id="jwtExpBadge"></span>
                            </div>
                            <pre id="jwtPayload" class="jwt-code">{}</pre>
                        </div>
                        <div class="jwt-card">
                            <div class="jwt-card-title">Signature / Meta</div>
                            <pre id="jwtMeta" class="jwt-code">No token decoded</pre>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const allLinks = [];
        BOOKMARKS_CONFIG.forEach(section => {
            section.links.forEach(link => {
                allLinks.push({ ...link, category: section.category });
            });
        });

        let openInNewTab = localStorage.getItem('homepage-new-tab') === 'true';
        document.getElementById('tabToggle').checked = openInNewTab;

        function renderStarredGrid() {
            const container = document.getElementById('starred-grid');
            const starredLinks = allLinks.filter(link => link.starred);

            if (starredLinks.length === 0) {
                container.innerHTML = `<div style="color:var(--muted-text);">No starred bookmarks found. Set 'starred: true' on items in BOOKMARKS_CONFIG.</div>`;
                return;
            }

            container.innerHTML = starredLinks.map(link => `
                <a class="bookmark-card" href="${link.url}" ${openInNewTab ? 'target="_blank"' : ''}>
                    <span class="card-star">★</span>
                    <span class="card-name">${link.name}</span>
                </a>
            `).join('');
        }

        function fuzzyMatch(pattern, text) {
            pattern = pattern.toLowerCase();
            const textLower = text.toLowerCase();
            
            let pIdx = 0;
            let score = 0;
            let matchedIndices = [];
            let consecutiveMatches = 0;

            for (let tIdx = 0; tIdx < text.length; tIdx++) {
                if (pIdx < pattern.length && textLower[tIdx] === pattern[pIdx]) {
                    matchedIndices.push(tIdx);
                    pIdx++;
                    consecutiveMatches++;
                    score += 5 + (consecutiveMatches * 3);

                    if (tIdx === 0 || text[tIdx - 1] === ' ' || text[tIdx - 1] === '/') {
                        score += 10;
                    }
                } else {
                    consecutiveMatches = 0;
                }
            }

            if (pIdx !== pattern.length) return null;
            return { score, matchedIndices };
        }

        function highlightMatches(text, indices) {
            let result = '';
            const indexSet = new Set(indices || []);
            for (let i = 0; i < text.length; i++) {
                if (indexSet.has(i)) {
                    result += `<mark>${text[i]}</mark>`;
                } else {
                    result += text[i];
                }
            }
            return result;
        }

        const searchInput = document.getElementById('localSearch');
        const dropdown = document.getElementById('launcherDropdown');
        let selectedIndex = -1;

        function updateDropdownSelection() {
            const items = dropdown.querySelectorAll('.dropdown-item[data-url], .dropdown-item[data-tab]');
            items.forEach((item, index) => {
                item.classList.toggle('selected', index === selectedIndex);
                if (index === selectedIndex) {
                    item.scrollIntoView({ block: 'nearest' });
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            selectedIndex = -1;

            if (!query) {
                dropdown.classList.remove('active');
                return;
            }

            const matches = [];

            BUILTIN_TOOLS.forEach(tool => {
                const match = fuzzyMatch(query, tool.name + " " + tool.keywords);
                if (match) {
                    matches.push({ ...tool, ...match, score: match.score + 25 });
                }
            });

            allLinks.forEach(link => {
                const match = fuzzyMatch(query, link.name);
                if (match) {
                    const boost = link.starred ? 15 : 0;
                    matches.push({ ...link, ...match, score: match.score + boost });
                }
            });

            matches.sort((a, b) => b.score - a.score);

            if (matches.length > 0) {
                dropdown.innerHTML = matches.map(item => {
                    if (item.type === 'tool') {
                        return `
                            <div class="dropdown-item" data-tab="${item.tab}">
                                <span>${highlightMatches(item.name, item.matchedIndices)}</span>
                                <span class="item-meta">
                                    <span class="tool-tag">TOOL</span>
                                </span>
                            </div>
                        `;
                    }
                    return `
                        <a class="dropdown-item" data-url="true" href="${item.url}" ${openInNewTab ? 'target="_blank"' : ''}>
                            <span>${highlightMatches(item.name, item.matchedIndices)}</span>
                            <span class="item-meta">
                                ${item.starred ? '<span class="star-badge">★</span>' : ''}
                                <span class="category-tag">${item.category}</span>
                            </span>
                        </a>
                    `;
                }).join('');
                dropdown.classList.add('active');
            } else {
                dropdown.innerHTML = `<div class="dropdown-item" style="cursor:default; color:var(--muted-text);">No matching bookmarks or tools</div>`;
                dropdown.classList.add('active');
            }
        });

        dropdown.addEventListener('click', (e) => {
            const item = e.target.closest('.dropdown-item');
            if (!item) return;
            const tabName = item.getAttribute('data-tab');
            if (tabName) {
                openModal(tabName);
                dropdown.classList.remove('active');
                searchInput.value = '';
            }
        });

        document.addEventListener('keydown', (e) => {
            const activeEl = document.activeElement;

            if (e.key === '/' && activeEl !== searchInput && !toolsModal.classList.contains('active')) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
                return;
            }

            if (e.key === 'Escape') {
                if (toolsModal.classList.contains('active')) {
                    closeModal();
                    return;
                }
                if (activeEl === searchInput) {
                    searchInput.value = '';
                    dropdown.classList.remove('active');
                    searchInput.blur();
                }
                settingsMenu.classList.remove('active');
                return;
            }

            if (activeEl === searchInput && dropdown.classList.contains('active')) {
                const items = dropdown.querySelectorAll('.dropdown-item[data-url], .dropdown-item[data-tab]');

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (!items.length) return;
                    if (selectedIndex === -1) selectedIndex = 0;
                    else selectedIndex = (selectedIndex + 1) % items.length;
                    updateDropdownSelection();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (!items.length) return;
                    if (selectedIndex === -1) selectedIndex = items.length - 1;
                    else selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                    updateDropdownSelection();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (selectedIndex >= 0 && items[selectedIndex]) {
                        items[selectedIndex].click();
                    } else if (items.length > 0) {
                        items[0].click();
                    }
                }
            }
        });

        const toolsModal = document.getElementById('toolsModal');
        const toolsBtn = document.getElementById('toolsBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const toolPanes = document.querySelectorAll('.tool-pane');

        function openModal(defaultTab = 'base64') {
            toolsModal.classList.add('active');
            switchTab(defaultTab);
        }

        function closeModal() {
            toolsModal.classList.remove('active');
        }

        function switchTab(tabName) {
            tabBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabName));
            toolPanes.forEach(pane => pane.classList.toggle('active', pane.id === `pane-${tabName}`));

            if (tabName === 'base64') document.getElementById('b64Input').focus();
            if (tabName === 'json') document.getElementById('jsonInput').focus();
            if (tabName === 'jwt') document.getElementById('jwtInput').focus();
        }

        toolsBtn.addEventListener('click', () => openModal('base64'));
        closeModalBtn.addEventListener('click', closeModal);
        toolsModal.addEventListener('click', (e) => {
            if (e.target === toolsModal) closeModal();
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        const b64Input = document.getElementById('b64Input');
        const b64Output = document.getElementById('b64Output');
        const b64Status = document.getElementById('b64Status');

        document.getElementById('b64EncodeBtn').addEventListener('click', () => {
            try {
                b64Output.value = btoa(unescape(encodeURIComponent(b64Input.value)));
                b64Status.textContent = 'Encoded!';
                b64Status.className = 'status-msg success';
            } catch (err) {
                b64Status.textContent = 'Encode Error';
                b64Status.className = 'status-msg error';
            }
        });

        document.getElementById('b64DecodeBtn').addEventListener('click', () => {
            try {
                b64Output.value = decodeURIComponent(escape(atob(b64Input.value.trim())));
                b64Status.textContent = 'Decoded!';
                b64Status.className = 'status-msg success';
            } catch (err) {
                b64Status.textContent = 'Invalid Base64 String';
                b64Status.className = 'status-msg error';
            }
        });

        document.getElementById('b64CopyBtn').addEventListener('click', () => {
            if (!b64Output.value) return;
            navigator.clipboard.writeText(b64Output.value);
            b64Status.textContent = 'Copied to Clipboard!';
            b64Status.className = 'status-msg success';
        });

        const jsonInput = document.getElementById('jsonInput');
        const jsonOutput = document.getElementById('jsonOutput');
        const jsonStatus = document.getElementById('jsonStatus');

        function processJSON(indent) {
            try {
                const parsed = JSON.parse(jsonInput.value);
                jsonOutput.value = indent ? JSON.stringify(parsed, null, indent) : JSON.stringify(parsed);
                jsonStatus.textContent = 'Valid JSON';
                jsonStatus.className = 'status-msg success';
            } catch (err) {
                jsonStatus.textContent = err.message;
                jsonStatus.className = 'status-msg error';
            }
        }

        document.getElementById('jsonFormat2Btn').addEventListener('click', () => processJSON(2));
        document.getElementById('jsonFormat4Btn').addEventListener('click', () => processJSON(4));
        document.getElementById('jsonMinifyBtn').addEventListener('click', () => processJSON(0));

        document.getElementById('jsonCopyBtn').addEventListener('click', () => {
            if (!jsonOutput.value) return;
            navigator.clipboard.writeText(jsonOutput.value);
            jsonStatus.textContent = 'Copied to Clipboard!';
            jsonStatus.className = 'status-msg success';
        });

        const jwtInput = document.getElementById('jwtInput');
        const jwtHeader = document.getElementById('jwtHeader');
        const jwtPayload = document.getElementById('jwtPayload');
        const jwtMeta = document.getElementById('jwtMeta');
        const jwtStatus = document.getElementById('jwtStatus');
        const jwtExpBadge = document.getElementById('jwtExpBadge');

        function decodeBase64Url(str) {
            let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) { base64 += '='; }
            return decodeURIComponent(escape(atob(base64)));
        }

        document.getElementById('jwtDecodeBtn').addEventListener('click', () => {
            const raw = jwtInput.value.trim();
            jwtExpBadge.innerHTML = '';
            
            if (!raw) {
                jwtStatus.textContent = 'Please paste a token';
                jwtStatus.className = 'status-msg error';
                return;
            }

            const parts = raw.split('.');
            if (parts.length !== 3) {
                jwtStatus.textContent = 'Invalid JWT format (must have 3 parts)';
                jwtStatus.className = 'status-msg error';
                return;
            }

            try {
                const header = JSON.parse(decodeBase64Url(parts[0]));
                const payload = JSON.parse(decodeBase64Url(parts[1]));

                jwtHeader.textContent = JSON.stringify(header, null, 2);
                jwtPayload.textContent = JSON.stringify(payload, null, 2);
                jwtMeta.textContent = `Signature Part: ${parts[2].substring(0, 24)}...`;

                if (payload.exp) {
                    const expTime = payload.exp * 1000;
                    const isExpired = Date.now() > expTime;
                    const expDate = new Date(expTime).toLocaleString();
                    
                    jwtExpBadge.innerHTML = `<span class="badge ${isExpired ? 'expired' : 'valid'}">${isExpired ? 'EXPIRED' : 'VALID'} (${expDate})</span>`;
                }

                jwtStatus.textContent = 'Successfully decoded';
                jwtStatus.className = 'status-msg success';
            } catch (err) {
                jwtStatus.textContent = 'Error parsing JWT token payload';
                jwtStatus.className = 'status-msg error';
            }
        });

        const gearBtn = document.getElementById('gearBtn');
        const settingsMenu = document.getElementById('settingsMenu');

        gearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsMenu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                dropdown.classList.remove('active');
            }
            if (!e.target.closest('.settings-wrapper')) {
                settingsMenu.classList.remove('active');
            }
        });

        document.getElementById('tabToggle').addEventListener('change', (e) => {
            openInNewTab = e.target.checked;
            localStorage.setItem('homepage-new-tab', openInNewTab);
            renderStarredGrid();
        });

        const themeSelect = document.getElementById('themeSelect');
        const root = document.documentElement;
        const savedTheme = localStorage.getItem('homepage-theme') || 'dark';

        root.classList.toggle('light-theme', savedTheme === 'light');
        themeSelect.value = savedTheme;

        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            root.classList.toggle('light-theme', theme === 'light');
            localStorage.setItem('homepage-theme', theme);
        });

        const localDateFormatter = new Intl.DateTimeFormat(undefined, { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
        const utcDateFormatter = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });

        function updateClocks() {
            const now = new Date();
            const pad = num => String(num).padStart(2, '0');
            document.getElementById('local-clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('local-date').textContent = localDateFormatter.format(now);
            document.getElementById('utc-clock').textContent = `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())}`;
            document.getElementById('utc-date').textContent = utcDateFormatter.format(now);
        }

        renderStarredGrid();
        setInterval(updateClocks, 1000);
        updateClocks();
    </script>
</body>

</html>
